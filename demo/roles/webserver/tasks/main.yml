---
- name: Install baseline packages
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
    state: present

- name: Ensure app directory exists
  ansible.builtin.file:
    path: /opt/acme/{{ app_release }}
    state: directory
    owner: acme
    group: acme
    mode: "0755"

- name: Copy health-check script
  ansible.builtin.copy:
    src: files/healthcheck.sh
    dest: /opt/acme/{{ app_release }}/healthcheck.sh
    mode: "0755"
  register: healthcheck_copy

- name: Wait for health check to pass
  ansible.builtin.uri:
    url: "http://localhost:8080/health"
    status_code: 200
  register: health_result
  until: health_result.status == 200
  retries: 5
  delay: 3
  when: healthcheck_copy.changed

- ansible.builtin.